<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Screen — Do App Ek Saath</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toolbar">
  <select id="layoutSelect">
    <option value="vertical">Side by side (⬌)</option>
    <option value="horizontal">Upar-neeche (⬍)</option>
  </select>
  <span style="color:#888; font-size:12px;">Kuch sites (jaise Google, YouTube, Instagram) security ki wajah se load nahi hongi — naya tab khol lein. TradingView ke liye box me "tradingview" ya "tradingview:NASDAQ:AAPL" type karein.</span>
</div>

<div id="container" class="vertical">
  <div class="pane" id="pane1">
    <div class="pane-bar">
      <input type="text" id="url1" placeholder="URL daalein, jaise wikipedia.org" value="https://www.wikipedia.org">
      <button onclick="loadPane(1)">Jao</button>
      <button onclick="openNewTab(1)">↗</button>
    </div>
    <div class="frame-holder" id="holder1">
      <iframe id="frame1" src="https://www.wikipedia.org"></iframe>
    </div>
  </div>

  <div id="divider"></div>

  <div class="pane" id="pane2">
    <div class="pane-bar">
      <input type="text" id="url2" placeholder="URL daalein" value="https://www.bing.com">
      <button onclick="loadPane(2)">Jao</button>
      <button onclick="openNewTab(2)">↗</button>
    </div>
    <div class="frame-holder" id="holder2">
      <iframe id="frame2" src="https://www.bing.com"></iframe>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
